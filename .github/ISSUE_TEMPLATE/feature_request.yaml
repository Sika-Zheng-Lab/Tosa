name: 💡 Feature Request
description: Suggest an idea for this project
title: '[Feature Request]: '
labels: ['request💡']

body:
  - type: textarea
    id: description
    attributes:
      label: '📋 Description'
      description: A clear and concise description of the request.
    validations:
      required: true

  - type: input
    id: tosa_version
    attributes:
      label: '🔖 Tosa Version'
      description: 'Specify the Tosa version you are using. You can find this information in the `tosa --version` command.'
      placeholder: 'e.g., vX.X.X'
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: '🔍 Environment'
      description: |
          Optional: The environment information.
          Example:
          OS: WSL (Ubuntu 22.04)
      value: |
          OS:
      render: markdown
    validations:
      required: false


  - type: textarea
    id: anything_else
    attributes:
      label: '📎 Anything else?'
      description: |
        Optional: Add any other contexts, links, or screenshots about the feature request here.
    validations:
      required: false
