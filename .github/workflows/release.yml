name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Validate release version
        id: version
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)

          if [[ ! "$CARGO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in Cargo.toml: $CARGO_VERSION" >&2
            exit 1
          fi
          if [[ "$CARGO_VERSION" != "$FILE_VERSION" ]]; then
            echo "Cargo.toml version $CARGO_VERSION does not match VERSION file $FILE_VERSION" >&2
            exit 1
          fi

          TAG="v${CARGO_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if ! git merge-base --is-ancestor "$TAG_COMMIT" HEAD; then
              echo "Tag $TAG does not point to an ancestor of this merge commit" >&2
              exit 1
            fi
            if ! git diff --quiet "$TAG_COMMIT" HEAD -- . ':(exclude).github/workflows/release.yml'; then
              echo "Source files changed since $TAG; bump the version for a new release" >&2
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
          TAG_COMMIT: ${{ steps.version.outputs.tag_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          body = os.environ.get("PR_BODY", "")
          if os.environ["TAG_EXISTS"] == "true":
              url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                     f"/commits/{os.environ['TAG_COMMIT']}/pulls")
              request = Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              })
              with urlopen(request) as response:
                  pulls = json.load(response)
              release_pulls = [pr for pr in pulls if pr["merged_at"]
                               and pr["base"]["ref"] == "main"
                               and pr["head"]["ref"] == "develop"]
              if len(release_pulls) != 1:
                  raise SystemExit("Could not identify the PR that created the existing tag")
              body = release_pulls[0].get("body") or ""

          if not body.strip():
              raise SystemExit("The release PR needs a description for the release notes")
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(body)
          PY

      - name: Checkout existing release tag
        if: steps.version.outputs.tag_exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git checkout --detach "$TAG"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Verify crates.io package
        run: cargo publish --dry-run --locked

      - name: Build Docker image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build \
            -t "naotokubota/tosa:$TAG" \
            -t naotokubota/tosa:latest \
            -f docker/Dockerfile .

      - name: Check crates.io publication
        id: crates_io
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen

          try:
              with urlopen("https://index.crates.io/to/sa/tosa") as response:
                  versions = [json.loads(line)["vers"] for line in response]
          except HTTPError as error:
              if error.code != 404:
                  raise
              versions = []

          published = os.environ["VERSION"] in versions
          if published and os.environ.get("TAG_EXISTS") != "true":
              raise SystemExit("Crate version already exists but the release tag does not")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"published={str(published).lower()}", file=output)
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}

      - name: Create and push tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish to crates.io
        if: steps.crates_io.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push Docker image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker push "naotokubota/tosa:$TAG"
          docker push naotokubota/tosa:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
