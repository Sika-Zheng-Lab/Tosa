[package]
name = "tosa"
version = "1.0.0"
edition = "2021"
description = "Fast junction and exon-intron boundary read counting from RNA-seq/scRNA-seq BAM/CRAM files"
repository = "https://github.com/Sika-Zheng-Lab/Tosa"
license = "MIT"
readme = "README.md"
keywords = ["bioinformatics", "rna-seq", "junction", "splicing", "cram"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = "4.0"
log = "0.4"
env_logger = "0.10"
rust-htslib = "0.48"
itertools = "0.10"
flate2 = "1.0"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tosa"
path = "src/main.rs"
